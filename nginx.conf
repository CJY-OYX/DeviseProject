# Vue应用 Nginx 配置文件
# 适用于xn--elq28dh12h.xyz域名

# HTTP服务器配置 - 重定向到HTTPS
server {
    listen 80;
    server_name xn--elq28dh12h.xyz www.xn--elq28dh12h.xyz;
    
    # 强制HTTPS重定向
    return 301 https://$server_name$request_uri;
}

# HTTPS服务器配置
server {
    listen 443 ssl http2;
    server_name xn--elq28dh12h.xyz www.xn--elq28dh12h.xyz;
    
    # SSL证书配置（需要根据实际情况修改）
    # ssl_certificate /etc/letsencrypt/live/xn--elq28dh12h.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/xn--elq28dh12h.xyz/privkey.pem;
    
    # SSL安全设置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 网站根目录
    root /var/www/vueapp;
    index index.html;
    
    # 日志配置
    access_log /var/log/nginx/vueapp_access.log;
    error_log /var/log/nginx/vueapp_error.log;
    
    # 处理Vue路由history模式
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }
    
    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # 安全头设置
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
}